<title>DAK Pro Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centered phone-width column. Home lists subjects with numbered 50-question tests; quiz is a header card + question card + sticky nav; result shows a score ring. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#faf8f3; --line:#e6e1d6; --fg:#16202e; --muted:#6a7280;
  --gold:#d4a24c; --gold-soft:#ecd3a1; --gold-ink:#7a5614; --good:#16a34a; --good-bg:#e7f6ec; --bad:#dc2626; --bad-bg:#fdeaea;
  --shadow:0 1px 2px rgba(22,32,46,.04),0 6px 20px rgba(22,32,46,.05);
  --f-display:'Newsreader',Georgia,serif; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface2:#1c2430; --line:#2a3342; --fg:#eceff4; --muted:#94a0b2;
  --gold:#e0b25e; --gold-soft:#5c4721; --gold-ink:#f0cf8f; --good:#34d27b; --good-bg:#12301f; --bad:#f06a6a; --bad-bg:#381a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface2:#1c2430; --line:#2a3342; --fg:#eceff4; --muted:#94a0b2;
  --gold:#e0b25e; --gold-soft:#5c4721; --gold-ink:#f0cf8f; --good:#34d27b; --good-bg:#12301f; --bad:#f06a6a; --bad-bg:#381a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  margin:0;padding-bottom:24px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top{padding-block:12px;display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:-.01em;margin-right:auto;cursor:pointer}
.brand b{color:var(--gold);font-weight:600}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px}
/* home */
.subj{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.subj h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0}
.subj .meta{color:var(--muted);font-size:14px;margin-top:2px}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tbtn{border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tbtn:hover{border-color:var(--gold)}
.tbtn .n{font-weight:700;font-size:15px}
.tbtn .c{font-size:12.5px;color:var(--muted)}
.tbtn .best{font-size:12.5px;font-weight:700;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.tbtn.mix{background:var(--gold);border-color:var(--gold);color:#2b1d03}
.tbtn.mix .c,.tbtn.mix .best{color:#4a3407}
/* subject page */
.crumb{color:var(--muted);font-size:17px;margin-top:22px}
.crumb a{cursor:pointer}
.sp h1{font-size:34px;margin:10px 0 22px}
.tc{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;padding:24px}
.tc .e{color:var(--muted);font-size:17px}
.tc .big{font-weight:800;font-size:28px;margin:6px 0 2px;letter-spacing:-.01em}
.tc .m{color:var(--muted);font-size:18px}
.tc .bst{color:var(--gold-ink);font-weight:700;font-size:15px;min-height:20px;margin-top:2px}
.go{margin-top:14px;height:56px;border-radius:18px;background:var(--gold);color:#2b1d03;font-weight:700;font-size:18px;width:100%;box-shadow:var(--shadow)}
.go.alt{background:var(--surface2);border:1px solid var(--gold);color:var(--fg)}
.sc{display:block;width:100%;text-align:left;padding:22px}
.sc:hover{border-color:var(--gold)}
.sc h2{font-family:var(--f-display);font-size:24px;font-weight:600;margin:0}
.sc .meta{color:var(--muted);font-size:15px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:14px}
/* quiz */
.head{display:flex;flex-direction:column;gap:14px}
.head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head .t{font-weight:700;font-size:18px;line-height:1.25}
.timer{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.timer svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:14.5px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;min-width:8px;background:var(--gold);border-radius:99px;transition:width .3s}
.next-msg{text-align:center;color:var(--gold-ink);font-weight:600;min-height:24px;margin:14px 0 10px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.qn{color:var(--muted);font-weight:600;font-size:17px}
.verdict{display:flex;align-items:center;gap:6px;font-weight:700}
.verdict svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.bm{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center}
.bm svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linejoin:round}
.bm.on{background:var(--gold-soft);border-color:var(--gold)} .bm.on svg{fill:var(--gold);stroke:var(--gold-ink)}
.qtext{font-size:23px;line-height:1.55;font-weight:700;margin:0 0 20px;overflow-wrap:anywhere;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:22px;padding:14px 18px 14px 14px;text-align:left;background:var(--surface);min-width:0;width:100%}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;background:var(--surface)}
.opt .tx{flex:1;min-width:0;font-size:18px;overflow-wrap:anywhere}
.opt .mk{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:none}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt.sel .k{background:var(--gold);color:#2b1d03;border-color:var(--gold)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .k{background:var(--good);border-color:var(--good);color:#fff} .opt.right .mk{display:block;color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff} .opt.wrong .mk{display:block;color:var(--bad)}
.opt:disabled{cursor:default}
.ans{margin-top:20px;color:var(--muted);font-size:17px;display:flex;flex-direction:column;gap:6px}
.ans b{color:var(--fg)} .ans .g b{color:var(--good)}
.navbar{position:sticky;bottom:0;background:var(--bg);padding-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;flex-direction:column;gap:12px;z-index:15}
.navrow{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}
.nb{height:58px;border-radius:18px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface)}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb.pri{background:var(--gold);border-color:var(--gold);color:#2b1d03}
.nb:disabled{opacity:.45;cursor:default}
.pills{display:flex;gap:10px;align-items:center;justify-content:center}
.pill{min-width:48px;height:52px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.pill.cur{background:var(--gold);border-color:var(--gold);color:#2b1d03}
.pill.gap{border:0;background:none;min-width:auto;color:var(--muted);padding:0 2px;cursor:default}
.gridbtn{width:56px;height:52px;margin-left:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.gridbtn svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linejoin:round}
/* modal */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:640px;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0 0 14px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-bottom:16px}
.qg{height:48px;border-radius:12px;border:1px solid var(--line);font-weight:700;position:relative;background:var(--surface2);font-variant-numeric:tabular-nums}
.qg.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.qg.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.qg.ans{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);margin:0;display:block;font-size:inherit;gap:0}
.qg.cur{outline:2px solid var(--fg);outline-offset:1px}
.qg .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);border:1px solid var(--line)}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set small{display:block;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--gold)} .sw[aria-pressed="true"]::after{transform:translateX(20px)}
.row2{display:flex;gap:12px}.row2 .nb{flex:1;height:52px}
.warn{color:var(--muted);margin:0 0 14px}
/* result */
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:200px;height:200px;margin:10px 0 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)} .ring .fg{stroke:var(--gold);transition:stroke-dashoffset 1s ease}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--f-display);font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring .sm{color:var(--muted);font-size:14px;margin-top:4px}
.grade{font-weight:800;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:14px}
.st{border:1px solid var(--line);border-radius:16px;padding:12px 4px;background:var(--surface2);min-width:0}
.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.st span{font-size:12.5px;color:var(--muted)}
.st.g b{color:var(--good)} .st.r b{color:var(--bad)}
.seg{display:flex;gap:8px;margin:20px 0 12px}
.seg button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2b1d03}
.rv{border-top:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:8px}
.rv .q{font-weight:700;overflow-wrap:anywhere}
.rv .a{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.rv .a b.g{color:var(--good)} .rv .a b.r{color:var(--bad)}
.hist{margin-top:6px;color:var(--muted);font-size:13.5px}
@media (max-width:400px){.qtext{font-size:21px}.opt .tx{font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}.pill{min-width:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const BANK=[{"id":"ped","name":"Pedagogika","sub":"DAK · Pedagogika","q":[["Akademiya nima?",["Kadrlar tayyorlash va bilimlarning keng sohalari bo‘yicha oliy va oliy o‘quv yurtidan keyingi ta’lim dasturlarini amalga oshirishga imkon beruvchi, yuridik maqomga ega ta’lim muassasasi.","Me’yordan, umumiy qonuniyatlardan chetlanish, noto‘g‘ri rivojlanish.","O‘zlashtirilgan bilimlarni amaliyotda qo‘llash ko‘nikmalarini shakllantiruvchi usul.","Shaxsga tabiat va jamiyat taraqqiyoti to‘g‘risidagi bilimlarni berish, uning aqliy (bilish) qobiliyati, tafakkuri va dunyoqarashini shakllantirishga yo‘naltirilgan pedagogik jarayon"],0],["Axloqiy ong nima?",["Shaxsga axloqiy me’yorlar va xulq-atvor qoidalari to‘g‘risidagi nazariy bilimlarni berish asosida hosil qilinuvchi ong shakli.","Ijtimoiy munosabatlar hamda shaxs xatti-harakatini tartibga soluvchi, muayyan jamiyat tomonidan tan olingan va rioya qilinishi zarur bo‘lgan xulq-atvor qoidalari, mezonlari yig‘indisi.","O‘zga millat va elatlarning haq-huquqlari, erki, urf-odatlari, an’analari, turmush tarzi, tili hamda vijdon erkinligini hurmat qilish, ularning manfaatlariga ziyon yetkazmaslikni ifoda etuvchi shaxsga xos ma’naviy-axloqiy fazilat.","shaxsga tabiat va jamiyat taraqqiyoti to‘g‘risidagi bilimlarni berish, uning aqliy (bilish) qobiliyati, tafakkuri va dunyoqarashini shakllantirishga yo‘naltirilgan pedagogik jarayon"],0],["Anomaliya soʻzi qaysi tildan olingan?",["yunoncha","lotincha","arabcha","inglizcha"],0],["Shaxsning ongida tushunchalar, sxemalar, ma’lum obrazlar ko‘rinishida aks etuvchi borliq haqidagi tizimlashtirilgan ilmiy ma’lumotlar majmui nima?",["bilim","dars","din","baho"],0],["Dars nima ?",["Bevosita o‘qituvchi rahbarligida muayyan o‘quvchilar guruhi bilan olib boriladigan ta’lim jarayonining asosiy shakli","Muayyan fan bo‘yicha ta’lim maqsadi, o‘quv dasturi va didaktik talablarga muvofiq belgilangan ilmiy bilimlar to‘g‘risidagi ma’lumotlarni beruvchi manba.","Bilim (ma’lumot,axborot)larni so‘z yordamida (og‘zaki) yetkazib berish, ifoda etish.","O‘quv jarayonining samaradorligini aniqlash, baholash va tahlil qilish"],0],["Bilish, ilmiy bilimlarning shakllanishi, xususiyatlari, qonuniyatlari, uslublari, ilmiy tafakkur shakllari, shuningdek, insonga xos bo‘lgan borliqni anglash qobiliyati haqidagi nazariya, ta’limot qaysi?",["Gnoseologiya","Verbal","Baynalmilal","Didaktika"],0],["Didaktika soʻzi qaysi tildan olingan?",["yunoncha","inglizcha","arabcha","lotincha"],0],["Dunyoqarash nima?",["tabiat, jamiyat, tafakkur hamda shaxs faoliyati mazmunining rivojlanib borishini belgilab beruvchi dialektik qarashlar va e’tiqodlar tizimi.","bevosita o‘qituvchi rahbarligida muayyan o‘quvchilar guruhi bilan olib boriladigan ta’lim jarayonining asosiy shakli.","o‘quv jarayonining samaradorligini aniqlash, baholash va tahlil qilish.","o'rganilayotgan obyekt, hodisa va jarayonlarni modellashtirish asosida o‘quvchining bilishga bo‘lgan qiziqish."],0],["Jamoa a’zolari tomonidan birdek qo‘llab quvvatlanuvchi barqarorlashgan odat deb nimaga aytiladi?",["jamoa anʼanalari","jamoaning norasmiy tuzilmasi","jamoa qoidalari","jamoa rasmiy tuzilmasi"],0],["Aniq maqsadga yo'naltirilgan anglash jarayoni qaysi?",["idrok","ong","tafakkur","sezgi"],0],["Axloq soʻzi qaysi tildan olingan?",["arabcha","lotincha","inglizcha","yunoncha"],0],["Baynalminallik nima?",["O‘zga millat va elatlarning haq-huquqlari, erki, urf-odatlari, an’analari, turmush tarzi, tili hamda vijdon erkinligini hurmat qilish, ularning manfaatlariga ziyon yetkazmaslikni ifoda etuvchi shaxsga xos ma’naviy-axloqiy fazilat.","Muayyan fan bo‘yicha ta’lim maqsadi, o‘quv dasturi va didaktik talablarga muvofiq belgilangan ilmiy bilimlar to‘g‘risidagi ma’lumotlarni beruvchi manba.","Mutaxassisliklar yoʻnalishi bo'yicha fundamental va amaliy bilim beradigan, ta’lim olish muddati kamida to‘rt yil davom etadigan tayanch oliy ta’lim.","Bevosita o‘qituvchi rahbarligida muayyan o‘quvchilar guruhi bilan olib boriladigan ta’lim jarayonining asosiy shakli."],0],["Yunoncha “oʻrgatuvchi” degan maʼnoni anglatadigan atama qaysi?",["didaktika","verbal","dars","axloq"],0],["Pedagogikada ta’limning xususiy qonuniyatlari nechta?",["5 ta","4 ta","6 ta","2 ta"],0],["Ta’lim jarayonida o‘quvchilar tomonidan o‘quv dasturida belgilangan muayyan mavzularni o‘zlashtirilish bo‘yicha bilim, ko‘nikma va malakalari darajasini aniqlash, baholash shakli qaysi?",["joriy nazorat","oraliq nazorat","takrorlash","yakuniy nazorat"],0],["Adaptatsiya soʻzi qaysi tildan olingan?",["lotincha","yunoncha","inglizcha","arabcha"],0],["Ijtimoiylashuv nima?",["ijtimoiy munosabatlar jarayonida faol ishtirok etishi asosida shaxsning hayot va ishlab chiqarish jarayoniga moslashuvi","anomal bolaning psixofiziologik imkoniyatlariga tayangan holda uning ijtimoiy munosabatlar jarayonida ishtirok etishi uchun zarur sharoit yaratish, ijtimoiy faoliyat va mehnatga jalb etish.","oʻquvchilarda ma’naviy axloqiy sifatlar, eʼtiqod hamda dunyoqarashni shakllantirish maqsadida ularning ongi, his-tuyg‘usi va irodasiga ta’sir ko‘rsatish usullari","anomal bolalar individual yoki guruhli xulqlarining ijtimoiy qadriyatlar va xulq atvor qoidalari tizimiga mos kelishi."],0],["Tarbiyalanuvchiga hissiy-og‘zaki ta’sir etish usuli qaysi?",["izohlash","baholash","tanbeh berish","jazolash"],0],["Yosh xususiyatlari nima?",["muayyan bir yosh davriga xos boʻlgan anatomik, fiziologik (jismoniy) va psixologik xususiyatlar","xatti-harakatlarini shartli refleks yordamidagina tashkil eta oluvchi biologik mavjudot","turli ko‘rinishdagi jamoa faoliyatini yo‘lga qo‘yishning tashkiliy jihatlari.","inson aqliy faoliyatining yuksak shakli sanalib, ijtimoiy voqea-hodisalar, jarayonlarga nisbatan ilmiy yondashuv"],0],["Kategoriya nima?",["fanning mohiyatini ochib beruvchi eng muhim, asosiy tushuncha","yaxlit ta’lim jarayonini qamrab oluvchi hamda murakkab psixofiziologik va ijtimoiy-pedagogik chora tadbirlarning amalga oshirilishini nazarda tutuvchi pedagogik tizim","kadrlar tayyorlash tizimining bosh subyekti va obyekti, ta’lim sohasidagi xizmatlarning iste’molchisi va ularni amalga oshirish.","shaxsning anomal rivojlanishi xususiyatlariga ko‘ra umumiy pedagogik ta’sir ko‘rsatish chora tadbirlari tizimi."],0],["Nima ijtimoiy munosabatlar jarayonida pedagogik g‘oyalarning tutgan o‘rni va roli, shaxsni kasbiy va ijtimoiy faoliyatga yo‘naltirish muammolarini o‘rganadi?",["ijtimoiy pedagogika","ijtimoiy-iqtisodiyot","ijtimoiy reabilitatsiya","ijtimoiy adaptatsiya"],0],["Individuallik nima?",["shaxsning o‘ziga xos xususiyatlari.","oʻzgalarga tegishli his tuygʻular yigʻindisi","jamoaviy birlik hissi","oila birlik hissi"],0],["Korreksiya qaysi tildan olingan?",["lotincha","arabcha","inglizcha","yunoncha"],0],["Ma’lum usullar yordamida tashkil etilgan bilimlarni o‘rganish jarayoni o‘quvchilar tomonidan o‘quv faoliyati usullarini egallab olishga yo‘naltirilgan faoliyat qaysi?",["oʻqish","tinglash","soʻzlab berish","yodlash"],0],["Savol va javob shaklidagi dialogik ta’lim metodi qaysi?",["suhbat","test","savol javob","oʻyin"],0],["\"Paradigma\" soʻzining maʼnosi nima?",["misol, namuna","suhbat, dialog","qarshilik, zidlik","ragʻbat"],0],["Estetika soʻzi qaysi tildan olingan?",["yunoncha","lotincha","fransuzcha","inglizcha"],0],["Kadrlar tayyorlash tizimining bosh subyekti va obyekti nima?",["shaxs","diplom","jamiyat","ustoz"],0],["“O‘qituvchi matonatli sof vijdonli, rostgo‘y, bolani tarbiyalash yo‘llarini, axloq qoidalarini yaxshi biladigan odam bo‘lmog‘i lozim. Muallim o‘quvchining butun ichki va tashqi dunyosini o‘rganib,uning aql qatlamlariga kirolmog‘i lozim” ushbu fikr kimga tegishli?",["Abu Ali ibn Sino","Qoshgʻariy","Abdulla Avloniy","Beruniy"],0],["Goʻdaklik davri qaysi davrlarni oʻz ichiga oladi?",["tugʻilgandan to 1 yoshgacha boʻlgan davrni","1 yoshdan 3 yoshgacha","3 yoshdan 5 yoshgacha","2 yoshdan 4 yoshgacha"],0],["Dunyoqarash negizida aks etuvchi ijtimoiy-falsafiy, huquqiy, ma’naviy-axloqiy, estetik-iqtisodiy, hamda ekologik bilimlaming takomillashgan k agogika","Oligofrenopedagogika","Surdopedagogika","Defektologiya"],0],["Aqli ojizlar ta’lim-tarbiyasi bilan shug‘ullanadigan tarmoq qaysi?",["Oligofreno pedagogika","Surdo pedagogika","Defektologiya","Tiflo pedagogika"],0],["Oʻquv-tarbiya jarayonida bolalarning fiziologik, anatomik xususiyatlarda dialektikani inobatga olinishi uchun boshlang‘ich asoslarni beruvchi fan qaysi?",["Fiziologiya","Biologiya","Gigiyena","Texnologiya"],0],["Oʻquvchilarning salomatligini muhofazalash, ularning jinsiy jihatdan to‘g‘ri shakllantirishda nazariy va amaliy g‘oyalari bilan yordam beradigan fan bu....?",["Gigiyena","Biologiya","Texnologiya","Fiziologiya"],0],["Muayyan, aniq maqsad hamda ijtimoiy-tarixiy tajriba asosida yosh avlodni har tomonlama o‘stirish, uning ongi, xulq-atvori va dunyoqarashini tarkib toptirish jarayoni?",["Tarbiya","Ta’lim","Hayot jarayoni","Shaxs"],0],["O‘quvchilarni nazariy bilim, amaliy ko‘nikma va malakalar bilan qurollantirish, ularning bilish qobiliyatlarini o‘stirish va dunyoqarashlarini shakllantirishga yo‘naltirilgan jarayon?",["Ta’lim olish","Bilim olish","Ma’lumot olish","Tarbiya olish"],0],["Shaxsda ma’naviy-axloqiy, ruhiy-intellektual, hissiy-irodaviy sifatlarni tarkib toptirish uchun zamin yaratadigan fan qaysi?",["Psixologiya","Tarix","Madaniyatshunoslik","Etika"],0],["Qanday qadriyat kishilar maʼnaviy faoliyati mahsuli , bilishning murakkab jarayoni natijasida vujudga kelgan bilim va malakalari samarasidir?",["ma’naviy","moddiy","milliy","madaniyat"],0],["Oqibat natijasida insonning ruhiy ehtiyojlari ,manfaatlari va faoliyat turlariga bogʻliq qadriyat bu –",["ma’naviy","milliy","madaniy","moddiy"],0],["Ma’lum bir shaxs yoki kishilar guruhida alohida ahamiyatga ega boʻlgan ma’naviyat turi bu -",["qadriyat","madaniyat","din","moddiy"],0],["Nima inson olgan bilimlarini hayotda qoʻllayotganda boshqalarni zavqlana olish holatiga aylanadi?",["madaniyat","qadriyat","ma’naviyat","moddiy"],0],["Shaxsning muayyan faoliyatni tashkil eta olish qobiliyati?", iya","Ijtimoiy pedagogik profilaktika"],0],["Maktab uchun ham, direktor uchun ham majburiy hisoblanadigan qarorlarni kim qabul qiladi?",["pedagogik kengash","direktor","maʼnaviyat ishlari rahbari","direktor oʻrinbosari"],0],["Pedagogik jamoa va o‘quvchilar bilan hamkorlikda fikrlashib ish olib borish boshqaruvning qaysi uslubga xos?",["demokratik uslub","liberal uslub","hamjihatlik uslubi","avtoritar uslub"],0],["Yakka hokimlik usulida barcha ishlami o‘zi hal etishga harakat qilishi “Men” ini yuqori qo‘yish boshqaruvning qaysi uslubga xos?",["avtoritar uslub","hamjihatlik uslubi","liberal uslub","demokratik uslub"],0],["Oʻz ishiga, vazifalariga e’tiborsizlik bilan qarash, mas’uliyatni sezmaslik boshqaruvning qaysi uslubiga xos?",["liberal uslub","demokratik","hamjihatlik uslubi","avtoritar uslub"],0],["... - bu insonning keng ma’noda ichki va tashqi omillar ta’sirida shakllanish jarayonidir. Bu jarayonda tarbiyaning muhim ahamiyat kasb etishi tushuniladi.",["insonni shakllanishi","inson huquqlari","inson kamoloti","insonni rivojlanishi"],0],["Fikrlashning original usulining sinonimlar yani odatdagi, qabul qilingan chegaralarni buzish qobiliyati nima deyiladi?",["ijod","tafakkur","salohiyat","fikrlash"],0],["Jaqiqiy va haqiqiy boʻlmagan yangi obyektlar obrazlarini yaratish qobiliyati nima deyiladi?",["hayol surish","fahmlash","fikrlash","izohlash"],0],["Muayyan millat, elatning etnopsixologik xususiyatlari, qarashlari, orzu-umidlari, intilishlari va maqsadi, hududiy, ijtimoiy-gʻoyaviy birlik mohiyatini anglatishga xizmat qiluvchi tasviriy belgilar majmui nima deb ataladi?",["davlat ramzlari","konstitutsiya","D.T.S.","davlat anʼanalari"],0],["... - oʻquvchilarga dastlabki ekologik bilimlarni berish, ularning mavjud ekologik bilimlarini boyitish, ularda tabiat va atrof-muhit muhofazasini tashkil etish konikma va malakalarni shakllantirishga qaratilgan pedagogik jarayon.",["ekologik tarbiya","estetik tarbiya","etik tarbiya","diniy tarbiya"],0],["... - muayyan oʻquv fani boʻyicha bilim, koʻnikma va malakalar mazmuni, umumiy vaqtning mavzularni oʻrganilishi boʻyicha taqsimlanishi, mavzularning ketma-ketligini belgilash hamda ularning oʻrganilish darajasini yorituvchi meyoriy hujjat.",["oʻquv dasturi","oʻquv reja","oʻquv majmui","ilmiy reja"],0],["Ekologiya soʻzi qaysi tildan olingan?",["yunoncha","inglizcha","lotincha","arabcha"],0],["Sezgi bergan narsalarning haqiqiy ma’nosini tezlik bilan tushunishga yordam beruvchi quvvat nima?",["ziyraklik","diqqat","fahmlash","aql"],0],["O‘quvchidagi xulqiy kamchilik yoki biron-bir noaxloqiy xatti-harakatlarni bartaraf etish maqsadida qanday jazo qo‘llaniladi?",["hayfsan berish","jismoniy jazo","ruhiy jazo","haydab yuboriladi"],0],["... - oliy ta’lim muassasasida o‘quv yilining yarmini tashkil etuvchi oʻzaro bog‘langan fanlarning ma’lum majmuini o‘zlashtirishga mo‘ljallangan va ular bo‘yicha yakuniy nazorat bilan tugallanadigan qismi.",["Oʻquv semestri","chorak","joriy nazorat","oʻquv yili"],0],["... - o‘qituvchi tomonidan mavzuga oid dalil, hodisa va voqealarning yaxlit yoki qismlarga bo‘lib, tasviriy vositalar yordamida obrazli tasvirlash yo‘li bilan ixcham, qisqa va izchil bayon qilinishi.",["hikoya","sheʼr","roman","doston"],0],["... - axborotdan foydalanish va turli harakatlami ko‘rsatilgan tartibda mustaqil bajarish ko‘nikmalarini egallash.",["oʻrganish","oʻzlashtirish","tushunish","yodlash"],0],["Biror narsa, hodisa, jarayonni o‘rganish yoki amalga oshirish uchun qo‘llash lozim bo‘lgan usullar majmuasi nima?",["usul","shakl","qoida","uslub"],0],["Biror texnologiya mutaxassisi nima deb ataladi?",["Texnolog","Oʻqituvchi","trener","murabbiy"],0],["O‘quvchilarning qiziqish va qobiliyatlarini rivojlantirish maqsadida sinfdan yoki maktabdan tashqari sharoitda uyushtiriluvchi qo‘shimcha ta’lim shakli nima deb ataladi?",["toʻgarak","musobaqa","bellashuv","dars"],0]]},{"id":"ona","name":"Ona tili","sub":"DAK · Ona tili (BTU tekshirgan)","q":[["Gap bo‘laklari ega+to‘ldiruvchi+ hol+ kesim tartibida joylashgan gapni aniqlang.",["Yormat Yo‘lchi bilan yonma-yon ketayotgan edi.","Po‘latjon bugun hammadan oldin uyg‘ondi.","Olma ko‘chatlarini yaxshi parvarish qildik.","O‘quvchilar dam olishga dala shiyponiga kelishdi"],0],["Javoblarning qaysi birida vazifadosh zidlov bog‘lovchisi gaplarni emas, gap bo‘laklarini bog‘lashga xizmat qilgan?",["Mol-u davlatingiz bilan emas, balki ilm-u hunaringiz bilan faxrlaning.","Ona ba’zan farzandi boshida parvona bo‘lardi, ba’zan beshikka bosh qo‘yganicha uxlab qolardi","Hammasini tinglardim, ammo o‘xshashini topmasdim aslo.","Aql va farosat quyoshga o‘xshaydi, beparvolik tufayli tushish mumkin bo‘lgan dog‘larga o‘rin qoldirmaydi."],0],["Qaysi kelishik qo‘shimchasi shaxs, narsa va o‘rin-joy otlariga qo‘shilganda ular gapda to‘ldiruvchi vazifasida keladi? 1. tushum 2. jo‘nalish 3. o‘rin-payt 4. chiqish",["1","1,2,4","1,3,4","1,2,3,4"],0],["Javoblarning qaysi birida vazifadosh bog‘lovchi zidlik munosabatidagi egalarni bog‘lagan?",["Yorning o‘zi emas, balki guli keldi.","Jo‘shadi buloqning kumush yoshlari, ham mungli, ham shirin jildirashlari.","U turmushdan, o‘tgan umridan rozi, lekin ana shu roziligini tushuntirib berolmas edi.","Kozimbek bilan Manzuraxon perronda kezishar edi."],0],["Qayg‘u bilan shodlik yonma-yon bo‘lishini unutmang. Ostiga chizilgan so‘z yordamchi so‘z turkumining qaysi turiga mansub?",["vazifadosh bog‘lovchi","sof bog‘lovchi","vazifadosh ko‘makchi","sof ko‘makchi"],0],["ega+hol+kesim qolipidagi gapni belgilang.",["Haqiqiy do‘stlarning sadoqati boshga ish tushganda bilinadi.","Ko‘p o‘tinni ozgina o‘t kuydiradi.","So‘zni dilingda pishitguncha, tilga olm","Inson go‘zalligi bilan emas, balki mehnati bilan kamol topadi."],0],["Qaysi gapda nutq taqozosi bilan faqat to‘ldiruvchi qatnashmagan to‘liqsiz gap berilgan?",["Kimga bo‘ysunish kerakligini aytishmadimi? – Aytishdi.","Sen avval shartimga roziligingni ayt! – Roziman","Sizning bunday yo‘qolganingizni Mahmud akangiz ham bilmasmidilar? – Hech kim bilmagan.","Qaytganlaringdan keyin sheriklaringni ko‘rdilaringmi? – Ko‘rdik"],0],["Qaysi gapda bir necha kesimlik ma’nolarini ifodalovchi bitta kesimlik shakliga ega bo‘lgan kesim berilgan?",["Sen bilan qanchalik baxtiyor ekanligimni so‘z bilan ta’riflashga ojizman.","Bugun mendek bir g‘arib dilni, qishloqdagi oddiy bir oila farzandini butun dunyoga tanitding.","Saxovatsiz boy yog‘insiz bulutga, ilmiga amal qilmagan olim ustiga kitob ortilgan eshakka o‘xshaydi","“Lolazor” romanini o‘qib chiqdim"],0],["Javoblarning qaysi birida dona son aniqlovchi vazifasida kelgan?",["Bitta qovun kamida o‘n so‘m turadi.","Poyezddan tushgan 3-4 yo‘lovchi tarqalib, bekatda Yigitalining yolg‘iz o‘zi qoldi.","Hamma yerim o‘ttiz yetti gektar.","Bulbulning maqomlari, kuylari to‘qqiz yuz to‘qson to‘qqiz emish."],0],["Osmon hadsiz, ufqlar, qirlar, jimirlaydi zarrin yog‘dud Osmon kabi tiniq tuyg‘ular mavj uradi bu yosh ko‘nglimd Gapda inversiya hodisasi qaysi bo‘laklarda yuz bergan?",["faqat to‘ldiruvchi","aniqlovchi, to‘ldiruvchi, hol","to‘ldiruvchi, kesim","hol, aniqlovchi, ega"],0],["Qaysi gapda nutq taqozosi bilan payt holi va to‘ldiruvchi qatnashmagan to‘liqsiz gap berilgan?",["Qaytganlaringdan keyin sheriklaringni ko‘rdilaringmi? – Ko‘rdik","Sizning bunday yo‘qolganingizni Mahmud akangiz ham bilmasmidilar? – Hech kim bilmagan.","Sen avval shartimga roziligingni ayt! – Roziman","Kimga bo‘ysunish kerakligini aytishmadimi? – Aytishdi."],0],["Qaysi javobda kesimlik ma’nolari nol shakl orqali ifodalangan ot kesim berilgan?",["Mirzacho‘lda ham cho‘lni bo‘stonga aylantirayotgan odamlar juda ko‘p.","Toshkentga tushib, bir mashinada o‘tin-ko‘mir olib chiq.","Bog‘imizning gavjum bo‘lishi bejiz emas edi.","Uyimizdan yaxshilar qadami sira uzilmas edi."],0],["Javoblarning qaysi birida yasama so‘zlar hol va kesim vazifasida kelgan?",["Birgalashib ovqatlansang– lazzatlanasan? Birgalashib ishlasang – xursand bo‘lasan.","Aqlli xalqqa intilsa, nodon o‘z qarindosh-urug‘lariga intiladi.","Yashash uchun foydali mehnat qilish  edi, lekin ko‘klam biroz noqulay keldi.","Gul to‘g‘risida yozganini ko‘rganim yo‘q, lekin paxta haqida ko‘p yozadi.","Yo‘lning ikki chetidagi g‘alla tovlanardi, ammo ular o‘tgan yillardagi kabi baland emas edi."],0],["Galma-gal ro‘y berayotgan qo‘shma voqea-hodisalarni bildirgn qo‘shma gapni toping.",["Dam jahlim chiqadi, dam kulgim qistaydi","Yo siz keling, yo men boray.","Mashinaning nuqsoni bo‘lsa, tuzatiladi yo yana yaxshirog‘i yasaladi.","Ba’zan hech narsani eshitgim kelmay qoladi, qizim."],0],["Qaysi vositalar qo‘shma gap qismlarini bog‘lash bilan birga ular o‘rtasida qiyoslash va zidlash munosabatini yuzaga chiqaradi?",["bo‘lsa, esa so‘zlari","biriktiruv bog‘lovchisi","zidlov bog‘lovchisi","ayiruv bog‘lovchilari"],0],["Qaysi gapda qiyoslash ma’nosi ifodalangan?",["Aql ko‘pga ko‘pga yetkazadi, hunar bo‘lsa insonni ko‘kka ko‘taradi.","Jahl – dushman, aql esa do‘stdir.","Yaxshilik qilmoqlik ulug‘ fazilatdir, buning qadriga yetmaslik esa illatdir.","Dono aybni o‘zidan axtaradi, ahmoq bo‘lsa do‘stini ayblaydi."],0],["Qaysi gapda zidlash ma’nosi mavjud?",["Rostgo‘ylik odamni kamolotga yetkazadi, yolg‘onchilik esa uni halokatga olib boradi.","Tovus o‘zining chiroyli patlarini ehtiyot qiladi, vijdonli odam esa o‘zining sharaf-u shonini asraydi.","Oy tunda kerak, aql esa kunda kerak.","Aql – eskirmas kiyim, bilim esa tuganmas buloqdir."],0],["Qo‘shma gap berilgan qatorni aniqlang.",["Bahrom kanizaga ko‘z tashlaydi, ammo uning hayratlanmasligi Bahromni qattiq darg‘azab etadi.","Bir kuni sarkarda ovdan qaytayotib, Bahromni o‘z oromgohiga taklif qiladi.","Haqiqatan, bu kelajakda dadil intilayotgan qalbning o‘z hayotidan mamnunligi, xolos.","Har bir inson fikr yuritish imkoniyatiga ega."],0],["Shu payt boshimiz ustida chaqmoq yarq etdi va momaqaldiroq gumburladi. Ushbu qo‘shma gap qismlari qanday munosabatni ifodalaydi?",["sabab-natija munosabatini","payt munosabatini","zidlik munosabatini","birinchi gap mazmunini ikkinchi gap orqali izohlamoqda"],0],["Qismlari o‘rtasida qiyoslash va zidlash munosabati bo‘lgan qo‘shma gap qaysi javobda keltirilgan?",["To‘g‘ri so‘z tosh yoradi, egri so‘z bosh yoradi.","Agar qiz bo‘lsang, otingni KImsanoy qo‘yaman, agar o‘g‘il bolsang, Kimsanboy qo‘yaman.","Aql ko‘pga yetkazadi, hunar bo‘lsa insonni ko‘okka ko‘taradi.","Oy tunda kerak, aql esa kunda kerak."],0],["Teng bog‘lovchi qaysi gapda qo‘shma gaplarni bog‘lamagan?",["Sobir nafaqat o‘qishda, balki sportda ham eng faol o‘quvchi.","U rostini gapirib bergani uchun onasi urishmadi, balki yolg‘on gapirish odobli bolaning ishi emasligini aytdi.","Oy goh eshik tirqishidan mo‘ralar, goh bulutlar orasida g‘oyib bo‘lardi.","U chiroqni o‘chirib sandal chetiga yotdi-yu, ko‘nglidagi g‘ulg‘ula kuchayib ketaverdi."],0],["Bog‘langan qo‘shma gaplarning qaysi birida ikkala kesim ham yasama?",["Bulbul gulzorn izlaydi, bo‘yog‘li esa doim xarobani ko‘zlaydi.","Sabrning boshi achchiq, oxiri esa shirindir.","Yomon ot o‘z egasini ghohga qulatadi, yaxshi ot esa o‘z sohibini halokatdan qutqaradi.","Ahmoqning yuragi og‘zida, aqllining tili esa yuragida bo‘ladi."],0],["Sabab-natija munosabatli gap qaysi qatorda berilgan?",["To‘satdan eshik sharaqlab ochildi va ostonada Ertoyev paydo bo‘ldi.","Kechqurun otam keldi va unga butun voqeani aytib berdim.","Mashina to‘xtadi-da, undan bir kishi tushdi.","Ro‘paradagi g‘orning bag‘ridan qora tutun ko‘tarildi va u yerdan yo‘tal tovushi eshitildi."],0],["Qaysi bog‘ovchilar bilan bog‘langan qo‘shma gaplar ketma-ket yuz bergan voqeani bildiradi?",["ayiruv","biriktiruv","zidlov","inkor"],0],["Inkor bog‘lovchisi qaysi javobda sodda kesimli gaplarni bog‘lagan?",["Na bironta odamning sharpasi ko‘rindi, na shitirlagan tovush eshitildi.","Sel na odamni ayadi, na dov-daraxtni tinch qo‘ydi.","Bu burgut ham ko‘r, ham qari. Na ucha oladi, na ko‘ra oladi.","Na unga, Begimqulga kulib boqadi, na o‘zi o‘ynab-kuladi."],0],["Kim odamlarga yaxshilik qilsa, yaxshi inson deyishadi. Ushbu gap?",["to‘ldiruvchi ergash gapli qo‘shma gap","ega ergash gapli qo‘shma gap","hol ergash gapli qo‘shma gap","kesim ergash gapli qo‘shma gap"],0],["Barcha maqtanchoqlarning birdan-bir qismati shuki, ular ertami, kechmi pand yeyishadi. Ushbu gapda ergash gap bosh gap tarkibidagi olmosh bilan ifodalangan qaysi gap bo‘lagini izohlab kelgan?",["kesimni","egani","to‘ldiruvchini","aniqlovchini"],0],["Nisbiy so‘z yordamida birikkan to‘ldiruvchi ergash gapli qo‘shma gap berilgan qatorni aniqlang.",["Kim odamlarga yaxshilik qilsa, yaxshi inson deyishadi.","Shuni bilingki, hech bir yangilik bexosiyat bo‘lmaydi.","Unga kim yaxshi gapirsa, o‘sha yaxshi odam bo‘lib ko‘rinardi.","Kimning ko‘ngli tog‘ bo‘lsa, uning yo‘li ham to‘g‘ri bo‘ladi."],0],["Ergashgan qo‘shma gaplarning qaysi turida shart mayli qo‘shimchasi gaplarni bog‘lovchi vosita sifatida ishtirok etishi mumkin? 1) kesim ergash gapli qo‘shma gap; 2) ega ergash gapli qo‘shma gap; 3) to‘ldiruvchi ergash gapli qo‘shma gap; 4) aniqovchi ergash gapli qo‘shma gap; 5) hol ergash gapli qo‘shma gap",["1, 2, 3, 4, 5","2, 3, 4, 5","3, 4, 5","1,3,4,5"],0],["Ergashgan qo‘shma gaplarning qaysi turida ergash gapning kesimi shart mayli shaklidagi fe'llar bilan ifodalanadi ?",["nisbiy so‘zli ergashgan qo‘shma gaplarda","ko‘makchili qurilmalar yordamida ergashgan qo‘shma gaplarda","deb so‘zi yordamida ergashgan qo‘shma gaplarda","ko‘rsatish olmoshili ergashgan qo‘shma gaplarda"],0],["Qaysi bog‘lovchilar ergash gap boshida keladi?",["shart bog‘lovchilari","ko‘makchili qurilmalar","-ki yuklamasideb so‘zi","maqsad bog‘lovchisi"],0],["Qaysi ergashtiruvchi bog‘lovchilar yordamida bog‘langan ergashgan qo‘shma gaplarda ergash gaplar bosh gapdan oldin keladi?",["basharti, mabodo","chunki, negaki","toki","go‘yoki, xuddi"],0],["Qaysi ergashtiruvchi bog‘lovchilar yordamida bog‘langan ergashgan qo‘shma gaplarda ergash gaplar bosh gapdan so‘ng keladi? 1)sabab ergashtiruvchi bog‘lovchilari bilan bog‘langanda; 2)maqsad ergashtiruvchi bog‘lovchilari bilan bog‘langanda; 3)shart ergashtiruvchi bog‘lovchilari bilan bog‘langanda; 4)qiyoslash-chog‘ishtiruv ergashtiruvchi bog‘lovchilari bilan bog‘langanda.",["1, 2, 4","1, 2, 3, 4","2, 3","3, 4"],0],["Qaysi ergashtiruvchi bog‘lovchilar yordamida bog‘langan ergashgan qo‘shma gaplarda ergash gaplar bosh gapdan so‘ng keladi?",["toki","agarda","basharti","mabodo"],0],["1.Aql qancha oz bo‘lsa, shuhratparastlik shuncha kuchayadi. 2. Kimda aql oz bo‘lsa, unda shuhratparastlik shuncha kuchayadi. Berilgan ergashgan qo‘shma gaplar qaysi turga mansub?",["1 - miqdor-daraja, 2 -to‘ldiruvchi ergash gapli qo‘shma gaplar","1, 2 - miqdor-daraja ergash gapli qo‘shma gaplar","1 - miqdor-daraja, 2 -aniqlovchi ergash gapli qo‘shma gap","1 - miqdor-daraja, 2 - miqdor-daraja ergash gapli qo‘shma gap"],0],["Vijdonni asrangiz har nedan ortiq, Bobolardan qolgan noyob bu tortiq, Toki avlodlarga yetolsin omon. (A.Oripov) Ushbu ergash gapning qanday ma'no ifodalayotganini aniqlang.",["maqsad ma'nosi","sabab ma'nosi","shart ma'nosi","qiyoslash-chog‘ishtiruv ma'nosi"],0],["Hosilimiz mo‘l bo‘lsa, uyimiz donga to‘lsa, turmish bo‘lar farovon. Berilgan gapdagi birinchi va ikkinchi gaplar qanday gaplar hisoblanadi?",["hol ergash gap","aniqlovchi ergash gap","to‘ldiruvchi ergash gap","bosh gap"],0],["Qaysi vosita yordamida bosh gapga bog‘langan ergash gapning kesimi III shaxs buyruq mayli shaklidagi fe'llar bilan ifodalanadi?",["deb so‘zi yordamida ergashgan qo‘shma gaplarda","ko‘makchili qurilmalar yordamida ergashgan qo‘shma gaplarda","nisbiy so‘zli ergashgan qo‘shma gaplarda","shart mayli vositasida ergashgan qo‘shma gaplarda"],0],["Bilingki, jim turib salomat bo‘lish gapirib malomatga qolishdan afzal. Ushbu gapning turini aniqlang.",["to‘ldiruvchi ergash gapli qo‘shma gap","kirish so‘zli sodda gap","ega ergash gapli qo‘shma gap","kesim ergash gapli qo‘shma gap"],0],["Ergash gapli qo‘shma gaplarning qaysi turida ergash gap bosh gapdan oldin yoki keyin kelishi mumkin? 1) kesim ergash gap; 2) ega ergash gap;3) to‘ldiruvchi ergash gap; 4) aniqlovchi ergash gap",["1, 2, 3, 4","2, 3, 4","3, 4","1, 2"],0],["Dutor chalib o‘tirsam, tori uzilib ketdi. Ushbu qo‘shma gapning turini aniqlang.",["hol ergash gapli qo‘shma gap","kesim ergash gapli qo‘shma gap","to‘ldiruvchi ergash gapli qo‘shma gap","aniqlovchi ergash gapli qo‘shma gap"],0],["Dutor chalib o‘tirsam, tori uzilib ketdi. Ushbu gap hol ergash gapning qaysi turiga mansub?",["payt ergash gap","o‘rin ergash gap","sabab ergash gap","maqsad ergash gap"],0],["Ergash gapning qaysi turi bosh gapga ko‘makchili qurilmalar vositasida bog‘lanadi?",["sabab ergash gap","to‘ldiruvchi ergash gap","maqsad ergash gap","miqdor-daraja ergash gap"],0],["Ergash gapni bosh gapga bog‘lash uchun xizmat qiladigan quyidagi vositalarning qaysilari bosh gap boshida keladi?",["shuning uchun, shu bois","chunki, negaki","go‘yo, bamisoli","-ki, toki"],0],["Quyidagi vositalarning qaysi biri bilan bog‘langanda qo‘shma gap «ergash gap bosh gap» shaklida bo‘ladi? 1) chunki; 2) shuning uchun; 3) negaki; 4) deb; 5) mabodo; 6) –ki",["2, 4, 5","1, 2, 3","4, 5, 6","4, 6"],0],["Quyidagi vositalarning qaysi biri bilan bog‘langanda qo‘shma gap «bosh gap + ergash gap» shaklida bo‘ladi? 1) maqsad bog‘lovchilari; 2) sabab bog‘lovchilari; 3) ko‘makchili qurilmalar; 4) deb yordamchi so‘zi; 5) nisbiy so‘zlar; 6) -ki yuklamasi",["1, 2, 6","3, 4, 5","faqat 6","1,2,3,4"],0],["Ergashtiruvchi bog‘lovchili ergashgan qo‘shma gap qaysi qatorda berilmagan?",["Siz Hindistonda neniki ko‘rgan bo‘lsangiz, shularning hammasini jam etib bir kitob yozmoq darkor.","Vijdonni asrangiz har nedan ortiq, Bobolardan qolgan noyob bu tortiq Toki avlodlarga yetolsin omon.","Misralarda so‘zlar gavhar kabi yonadi, go‘yo yangi ranglar, yangi jilvalar bilan porlaydi.","Mabodo boshingga qilich kelsa ham, to‘g‘ri gapir."],0],["Ko‘makchili qurilmalar yordamida ergashgan qo‘shma gap qaysi javobda berilgan?",["Ilmsiz inson - mevasiz daraxt, shuning uchun har vaqt ilm olish ilinjida bo‘l.","Shu mo‘jaz uyimda yonsin deb chiroq, Ne aziz zotlarga yondashdim gohi.","Odobli odam tabibga o‘xshaydi, chunki u bilan suhbatlashish ko‘ngildagi g‘amni quvadi.","Ishonchim komilki, qasd qilganlar, albatta past bo‘ladi."],0],["Qaysi vositalar bilan bog‘langanda ergash gap bosh gapda ifodalangan mazmunning maqsadi yoki sababini bildiradi?",["shuning uchun, shu sababli ko‘makchili qurilmalar yordamida","chunki, negaki sabab bog‘lovchilari yordamida","deb bog‘lovchi vazifasidagi so‘z yordamida","toki maqsad bog‘lovchisi yordamida"],0],["Qaysi vosita bilan bog‘langanda ergash gap bosh gap tarkibidagi ko‘rsatish olmoshi ma'nosini izohlab keladi?",["-ki yuklamasi yordamida","-sa shart mayli qo‘shimchasi yordamida","deb bog‘lovchi vazifasidagi so‘z yordamida","shu bois ko‘makchili qurilma yordamida"],0],["Nisbiy so‘zli ergashgan qo‘shma gap qaysi qatorda berilgan?",["Kimning ko‘ngli ochiq bo‘lsa, uning el o‘rtasidagi martabasi ulug‘ bo‘ladi.","Shunday odamlar borki, ular bilan gaplashib bahra olasan.","Shuni angladimki, inson qobiliyati cheksiz ekan.","Berilgan gaplarning barchasi nisbiy so‘zli ergashgan qo‘shma gap sanaladi."],0],["Qaysi javobda ergashgan qo‘shma gaplarning sodda gap bilan ma'nodoshligi to‘g‘ri berilgan?",["Shuni sezdimki, oila a'zolari bir-biri bilan juda ittifoq ekan. - Oila a'zolarining bir-biri bilan juda ittifoq ekanligini sezdim.","Shuni bilingki, kengga keng dunyo, torga tor dunyo. - Dunyo kengga keng, torga tordir.","Shunga xursandmizki, bolalar o‘z yo‘lini topib ketishdi. - Bolalarning o‘z yo‘lini topib ketishgani yaxshi bo‘ldi.","Barcha gaplarda ergashgan qo‘shma gaplarning sodda gap bilan ma'nodoshligi to‘g‘ri berilgan."],0],["Masalaning mohiyati shu ekanki, bosh vrach qabulxonasiga kichkina telefonogramma tushibdi. Berilgan qo‘shma gapning turini aniqlang.",["kesim ergash gapli qo‘shma gap","ega ergash gapli qo‘shma gap","to‘ldiruvchi ergash gapli qo‘shma gap","hol ergash gapli qo‘shma gap"],0],["Buning natijasi shu bo‘ldiki, To‘laganning qanshariga musht tushdi. Ushbu gap ergash gapli qo‘shma gapning qaysi turiga mansub?",["kesim ergash gapli qo‘shma gap","ega ergash gapli qo‘shma gap","natija (hol) ergash gapli qo‘shma gap","aniqlovchi ergash gapli qo‘shma gap"],0],["Kim birovga yaxshilik qilsa, . . .Ushbu ergash gapga bosh gapni qo‘shish orqali ergash gapli qo‘shma gapning qaysi turini hosil qilish mumkin? 1) ega ergash gapli qo‘shma gap; 2) aniqlovchi ergash gapli qo‘shma gap; 3) to‘ldiruvchi ergash gapli qo‘shma gap",["1, 2, 3","faqat 1","1, 2","2, 3"],0],["Nisbiy so‘zlar yordamida bog‘langan hol ergash gapli qo‘shma gap berilgan javobni toping.",["Soy qanchalik tez oqsa, u shunchalik sayoz bo‘ladi.","Har kim o‘z og‘zining qorovuli bo‘lsa, uning nafasi hech qachon bo‘g‘ilmaydi.","Odamlar ishdan qolmasin deb, marosimni soat 5 ga tayin qilganmiz.","berilgan gaplarning barchasi"],0],["Nima ro‘zg‘orga kerak bo‘lsa, dadam o‘shani bozordan keltiraverar edi. Ushbu gapda ergash gap bosh gap tarkibidagi qaysi bo‘lakning ma’nosini izohlagan?",["to‘ldiruvchi","ega","hol","aniqlovchi"],0],["Qaysi javobda faqat hol ergash gapli qo‘shma gaplar berilgan?",["Boshingga tashvish tushmasa, qaytib kelmasding. Oyna opa xatni oxirigacha o‘qiy olmadi, chunki hovlining eshigini kimdir taqillata boshladi.","Yodingizda saqlangki, birovga yolg‘on gapirish eng katta gunohdir. Kechqurun osh suzsak, bir nasiba kam.","Hali Onaxonning bilmaganlari shu qadar ko‘p ediki, so‘rab oxiriga yetolmasday ko‘rindi. Anvarga shunisi qiziq tuyuldiki, bu yerda hamma daraxtlar bir chiziq ustida saf turganday ko‘rinardi.","Qayerda ahillik bo‘lsa, o‘sha yerda qut-baraka bo‘ladi. Qalbingiz nimani buyursa, siz menga shuni buyuring."],0],["Bu suvni ichgandan so‘ng kim yolg‘on gapirsa, qulog‘i o‘sib ketarmish.Ushbu qo‘shma gap turi qaysi qatorda to‘g‘ri izohlangan?",["aniqlovchi ergash gapli qo‘shma gap","payt ergash gapli qo‘shma gap","hol ergash gapli qo‘shma gap","ega ergash gapli qo‘shma gap"],0],["Ega ergash gapli qo‘shma gap berilgan qatorni aniqlang. 1.Kim ko‘p o‘qisa, dunyoqarashi keng bo‘ladi. 2. Kim alam chekmaydi umrida bir bor, U meni anglamas, anglamas aslo.3.Kimki bo‘lsa dilozor, undan el-u yurt bezor. 4. Kimki qasd etsa anga, kiysin pushaymondin kafan.",["2,4","faqat 2","1, 2, 4","1, 2, 3, 4"],0],["O‘rin ergash gapli qo‘shma gap berilgan qatorni aniqlang. 1. Katta arava qaysi yo‘ldan yursa, kichik arava ham xuddi shu yo‘ldan yuradi. 2. Qayerda ish to‘g‘ri yo‘lga qo‘yilgan bo‘lsa, o‘sha yerda rivojlanish bo‘ladi. 3. Qayerda ahillik bo‘lsa, o‘sha yerda qut-baraka bo‘ladi. 4. Ahillik bor yerda temir suvga cho‘kmaydi.",["2, 3","2, 3, 4","1, 2, 3","1,2,3,4"],0],["Kesim ergash gapli qo‘shma gap berilgan qatorni aniqlang. 1. Buning natijasi shu bo‘ldiki, To‘laganning qanshariga musht tushdi. 2. Donolarning o‘giti shundayki, so‘zning lazzati gapirishda emas, balki eshitishdadir.3.Qizig‘i shundaki, shu ko‘rinishiga ovozi muloyim edi. 4.Umidim uldurkim, so‘zim martabasi avjdan quyi inmagay.",["1,2,3,4","3, 4","1, 2, 3","1, 3, 4"],0],["Aniqlovchi ergash gapli qo‘shma gap berilgan qatorni aniqlang. 1. Saxiylikni odat qilgan bo‘lsa kim, Qo‘lidan davlati ketmasin uning. 2.Bu suvni ichgandan so‘ng kim yolg‘on gapirsa, qulog‘i o‘sib ketarmish. 3. Haqiqat shunday jonki, pardoz uning husnini buzadi. 4. Vaziyat shundayki, hamma og‘irlik bizga tushgan.",["1, 2, 3","1, 3, 4","2, 3, 4","1,2,3,4"],0],["-sa shart mayli qo‘shimchasi yordamida bosh gapga bog‘langan ergash gapli qo‘shma gaplar qaysi javobda to‘g‘ri ko‘rsatilgan? 1. O‘simlikni qancha parvarish qilsang, shuncha mo‘l hosil olasan. 2. Oqsoqol qayerda bo‘lsa, o‘sha joyda ish bir tartibda boradi. 3. Boshingga tashvish tushmasa, qaytib kelmasding. 4. Kechqurun osh suzsak, bir nasiba kam.",["3va4","1va2","1, 2, 3","1,2,3,4"],0],["Saxiylikni odat qilgan bo‘lsa kim, Qo‘lidan davlati ketmasin uning. Ushbu qo‘shma gap qismlarini bog‘lash uchun xizmat qilayotgan vositani ko‘rsating.",["nisbiy so‘zlar yordamida","bog‘lovchi vazifasidagi bo‘lsa so‘zi yordamida","-sa shart mayli qo‘shimchasi yordamida","grammatik vositalarsiz, ohang yordamida"],0],["Qa /* helpers */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PIN=/barcha|hammasi|hech biri|yuqoridagilar|toʻgʻri javob yoʻq|to['ʻ`’‘]g['ʻ`’‘]ri javob yo['ʻ`’‘]q|A va B|B va C|A, B|hech qaysi|yuqoridagi/i;
const NUMISH=/^[\d\s,.;:)\-–—+/()=]+$/;
function buildOptions(item){
  const [q,opts,c]=item; const arr=opts.map((t,i)=>({t,ok:i===c}));
  if(arr.some(o=>PIN.test(o.t))){ // keep order, but rotate not allowed; keep as written
    return arr;
  }
  if(arr.every(o=>NUMISH.test(o.t)&&o.t.length<14)){
    return arr.slice().sort((a,b)=>a.t.length-b.t.length||a.t.localeCompare(b.t,undefined,{numeric:true}));
  }
  return shuffle(arr);
}
function fmt(sec){sec=Math.max(0,sec|0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function testsOf(sub){
  const n=sub.q.length, out=[];
  for(let i=0;i<n;i+=PER) out.push({idx:out.length+1,from:i,to:Math.min(n,i+PER)});
  return out;
}

/* START */
function start(sid,t){
  const sub=BANK.find(s=>s.id===sid); let items,name;
  if(t==='mix'){items=shuffle(sub.q).slice(0,PER);name='Aralash test'}
  else{const ts=testsOf(sub).find(x=>x.idx==t);items=sub.q.slice(ts.from,ts.to);name=ts.idx+'-test';items=shuffle(items)}
  S={sid,t,sub,name,qs:items.map(it=>({q:it[0],o:buildOptions(it),pick:null,bm:false})),i:0,total:items.length*SEC_PER_Q,left:items.length*SEC_PER_Q,done:false,t0:Date.now()};
  S.endAt=Date.now()+S.total*1000;
  chrome(true);
  clearInterval(tick);
  tick=setInterval(()=>{
    S.left=Math.max(0,Math.round((S.endAt-Date.now())/1000));
    const el=$('#tm'); if(el){el.textContent=fmt(S.left);el.parentElement.classList.toggle('low',S.left<300)}
    if(S.left<=0) finish();
  },500);
  renderQ();
}

  const done=S.qs.filter(isAns).length;
  const right=q.pick!==null&&q.o[q.pick].ok;
  const L='ABCDEF';
  let h=`<div class="card head"><div class="row"><div><div class="eyebrow">${esc(S.sub.name)}</div><div class="t">${esc(S.sub.name)} · ${esc(S.name)}</div></div>
    <div class="timer ${S.left<300?'low':''}">${ICON.clock}<span id="tm">${fmt(S.left)}</span></div></div>
    <div><div class="prog" style="margin-bottom:8px"><span>Javob berilgan: ${done}</span><span>${S.i+1}/${n} savol</span></div>
    <div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div></div></div>
    <div class="next-msg" id="nm">${shown&&cfg.auto&&S.i<n-1?'Keyingi savolga 1 s…':''}</div>
    <div class="card"><div class="qtop"><span class="qn">Savol ${S.i+1} / ${n}</span><span style="display:flex;align-items:center;gap:12px">
      ${shown?`<span class="verdict ${right?'ok':'no'}">${right?ICON.check+"Toʻgʻri":ICON.x+"Notoʻgʻri"}</span>`:''}
      <button class="bm ${q.bm?'on':''}" id="bm" aria-label="Belgilash">${ICON.bm}</button></span></div>
    <p class="qtext">${esc(q.q)}</p><div class="opts">`;
  q.o.forEach((o,i)=>{
    let cls='';
    if(shown){ if(o.ok) cls='right'; else if(q.pick===i) cls='wrong'; }
    else if(q.pick===i) cls='sel';
    h+=`<button class="opt ${cls}" data-i="${i}" ${shown?'disabled':''}><span class="k">${L[i]}</span><span class="tx">${esc(o.t)}</span>
      <svg class="mk" viewBox="0 0 24 24">${o.ok?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':'<path d="M6 6l12 12M18 6L6 18"/>'}</svg></button>`;
  });
  h+=`</div>`;
  if(shown){
    const ok=q.o.findIndex(o=>o.ok);
    h+=`<div class="ans"><div>Talaba tanlagan javob: <b>${L[q.pick]}) ${esc(q.o[q.pick].t)}</b></div><div class="g">Toʻgʻri javob: <b>${L[ok]}) ${esc(q.o[ok].t)}</b></div></div>`;
  }
  h+=`</div>
  <div class="navbar"><div class="navrow">
    <button class="nb" id="prev" ${S.i===0?'disabled':''}>${ICON.left}Oldingi</button>
    ${S.i<n-1?`<button class="nb pri" id="next">Keyingi${ICON.right}</button>`:`<button class="nb pri" id="fin">Yakunlash${ICON.check}</button>`}
  </div><div class="pills">${pills(n)}<button class="gridbtn" id="grid" aria-label="Barcha savollar">${ICON.grid}</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#bm').onclick=()=>{q.bm=!q.bm;$('#bm').classList.toggle('on',q.bm)};
  $('#prev').onclick=()=>go(S.i-1);
  if($('#next'))$('#next').onclick=()=>go(S.i+1);
  if($('#fin'))$('#fin').onclick=openFinish;
  $('#grid').onclick=openGrid;
  app.querySelectorAll('.pill[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(shown&&cfg.auto&&S.i<n-1) advT=setTimeout(()=>{ if(S&&S.qs[S.i]===q) go(S.i+1)},1000);
  window.scrollTo({top:0});
}
function pills(n){
  const set=new Set([0,1,2,n-1,S.i-1,S.i,S.i+1].filter(x=>x>=0&&x<n)); const a=[...set].sort((x,y)=>x-y);
  const keep=window.innerWidth<420?new Set([0,S.i,n-1,S.i+1].filter(x=>x>=0&&x<n)):set;
  const arr=[...keep].sort((x,y)=>x-y);
  let out='',prev=-1;
  for(const x of arr){ if(prev>=0&&x-prev>1) out+='<span class="pill gap">…</span>'; out+=`<button class="pill ${x===S.i?'cur':''}" data-go="${x}">${x+1}</button>`; prev=x; }
  return out;
}
function go(i){ if(i<0||i>=S.qs.length||S.done)return; S.i=i; renderQ() }
function pick(i){
  const q=S.qs[S.i];
  if(cfg.instant){ if(isAns(q))return; q.pick=i; renderQ(); }
  else{ q.pick=i; renderQ(); }
}
document.addEventListener('keydown',e=>{
  if(!S||S.done||modal.innerHTML)return;
  const k=e.key.toLowerCase(), idx='abcdef'.indexOf(k);
  if(idx>=0&&idx<S.qs[S.i].o.length&&k.length===1){pick(idx)}
  else if(e.key==='ArrowRight')go(S.i+1); else if(e.key==='ArrowLeft')go(S.i-1);
});

/* MODALS */
function sheet(inner){modal.innerHTML=`<div class="sheet" id="sh"><div class="in">${inner}</div></div>`;$('#sh').onclick=e=>{if(e.target.id==='sh')closeModal()}}
function openGrid(){
  const L=S.qs.map((q,i)=>{
    let c='qg';
    if(q.pick!==null) c+= cfg.instant?(q.o[q.pick].ok?' ok':' no'):' ans';
    if(i===S.i)c+=' cur';
    return `<button class="${c}" data-go="${i}">${i+1}${q.bm?'<span class="dot"></span>':''}</button>`}).join('');
  sheet(`<h3>Barcha savollar</h3><div class="legend"><span style="--c:var(--good-bg)">Toʻgʻri</span><span style="--c:var(--bad-bg)">Notoʻgʻri</span><span style="--c:var(--surface2)">Javobsiz</span><span style="--c:var(--gold)">Belgilangan</span></div>
   <div class="qgrid">${L}</div><div class="row2"><button class="nb" id="cl">Yopish</button><button class="nb pri" id="fn">Yakunlash</button></div>`);
  $('#cl').onclick=closeModal; $('#fn').onclick=openFinish;
  modal.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeModal();go(+b.dataset.go)});
}
function openFinish(){
  const un=S.qs.filter(q=>!isAns(q)).length;
  sheet(`<h3>Testni yakunlaysizmi?</h3><p class="warn">${un?`Javob berilmagan ${un} ta savol bor. Ular xato hisoblanadi.`:'Barcha savollarga javob berdingiz.'}</p>
   <div class="row2"><button class="nb" id="cl">Davom etish</button><button class="nb pri" id="ok">Yakunlash</button></div>`);
  $('#cl').onclick=closeModal; $('#ok').onclick=()=>{closeModal();finish()};
}
function confirmLeave(){
  sheet(`<h3>Testdan chiqasizmi?</h3><p class="warn">Joriy natija saqlanmaydi.</p><div class="row2"><button class="nb" id="cl">Qolish</button><button class="nb pri" id="ok">Chiqish</button></div>`);
  $('#cl').onclick=closeModal; $('#ok').onclick=()=>subject(S.sid);
}
$('#btnSet').onclick=()=>{
  sheet(`<h3>Sozlamalar</h3>
   <div class="set"><div>Javobni darhol koʻrsatish<small>Tanlagandan keyin toʻgʻri yoki notoʻgʻri ekani chiqadi</small></div><button class="sw" id="s1" aria-pressed="${cfg.instant}" aria-label="Javobni darhol koʻrsatish"></button></div>
   <div class="set"><div>Avtomatik keyingi savol<small>Javobdan 1 soniya keyin oʻtadi</small></div><button class="sw" id="s2" aria-pressed="${cfg.auto}" aria-label="Avtomatik keyingi savol"></button></div>
   <div class="row2" style="margin-top:18px"><button class="nb pri" id="cl">Tayyor</button></div>`);
  $('#cl').onclick=closeModal;
  const tg=(id,key,lsk)=>$(id).onclick=()=>{cfg[key]=!cfg[key];LS.set(lsk,cfg[key]);$(id).setAttribute('aria-pressed',cfg[key])};
  tg('#s1','instant','dak_instant');tg('#s2','auto','dak_auto');
};

/* RESULT */
function finish(){
  if(!S||S.done)return; S.done=true; clearInterval(tick);clearTimeout(advT);closeModal();
  const n=S.qs.length, ok=S.qs.filter(q=>q.pick!==null&&q.o[q.pick].ok).length;
  const wr=S.qs.filter(q=>q.pick!==null&&!q.o[q.pick].ok).length, sk=n-ok-wr;
  S.ok=ok;S.wr=wr;S.sk=sk;S.score=Math.round(ok/n*1000)/10; S.spent=Math.round((Date.now()-S.t0)/1000);
  const key=S.sid+':'+S.t; if(best[key]==null||S.score>best[key]){best[key]=S.score;LS.set('dak_best',best)}
  renderRes('wrong');
}
function grade(p){return p>=86?['Aʼlo (5)','var(--good)']:p>=71?['Yaxshi (4)','var(--gold-ink)']:p>=56?['Qoniqarli (3)','var(--gold-ink)']:['Qoniqarsiz (2)','var(--bad)']}
function renderRes(mode){
  const n=S.qs.length,R=88,C=2*Math.PI*R,g=grade(S.score);
  let h=`<section class="card res" style="margin-top:8px"><div class="eyebrow">${esc(S.sub.name)} · ${esc(S.name)}</div>
   <div class="ring"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="${R}" fill="none" stroke-width="14"/><circle class="fg" id="rg" cx="100" cy="100" r="${R}" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
   <div class="mid"><div class="big">${String(S.score).replace('.',',')}</div><div class="sm">ball / 100</div></div></div>
   <div class="grade" style="color:${g[1]}">${g[0]}</div>
   <div class="stats"><div class="st g"><b>${S.ok}</b><span>Toʻgʻri</span></div><div class="st r"><b>${S.wr}</b><span>Notoʻgʻri</span></div><div class="st"><b>${S.sk}</b><span>Javobsiz</span></div><div class="st"><b>${fmt(S.spent)}</b><span>Sarflangan vaqt</span></div></div>
   <div class="hist">${S.ok} / ${n} savolga toʻgʻri javob berdingiz. Eng yaxshi natija: ${String(best[S.sid+':'+S.t]).replace('.',',')} ball.</div>
   <div class="row2" style="width:100%;margin-top:18px"><button class="nb" id="home">Testlar roʻyxati</button><button class="nb pri" id="again">Qayta topshirish</button></div></section>
   <div class="seg"><button data-m="wrong" aria-pressed="${mode==='wrong'}">Xatolar (${S.wr+S.sk})</button><button data-m="all" aria-pressed="${mode==='all'}">Hammasi (${n})</button></div><div class="card" style="padding:4px 20px">`;
  const L='ABCDEF'; let cnt=0;
  S.qs.forEach((q,i)=>{
    const r=q.pick!==null&&q.o[q.pick].ok; if(mode==='wrong'&&r)return; cnt++;
    const ok=q.o.findIndex(o=>o.ok);
    h+=`<div class="rv"><div class="q">${i+1}. ${esc(q.q)}</div>
      <div class="a">Sizning javobingiz: ${q.pick===null?'<b class="r">javob berilmagan</b>':`<b class="${r?'g':'r'}">${L[q.pick]}) ${esc(q.o[q.pick].t)}</b>`}</div>
      ${r?'':`<div class="a">Toʻgʻri javob: <b class="g">${L[ok]}) ${esc(q.o[ok].t)}</b></div>`}</div>`;
  });
  if(!cnt) h+=`<div class="rv" style="border:0;text-align:center;color:var(--good);font-weight:700">Xato yoʻq. Barakalla!</div>`;
  h+=`</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$('#rg');if(e)e.style.strokeDashoffset=C*(1-S.score/100)}));
  chrome(false);$('#home').onclick=()=>subject(S.sid); $('#again').onclick=()=>start(S.sid,S.t);
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const y=window.scrollY;renderRes(b.dataset.m);window.scrollTo(0,y)});
}
home();
</script>
